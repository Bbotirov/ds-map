<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ds-map</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    body.dark { background: #0a0c11; color: #ebe6dc; }
    body.light { background: #f5f2ea; color: #1f2228; }
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; }
    #map { flex: 1; border-bottom: 1px solid var(--line-color); }
    #feed { height: 120px; overflow-y: auto; font-size: 11px; padding: 6px; }
    .feed-item { display: flex; gap: 6px; align-items: baseline; margin-bottom: 2px; }
    .symbol { font-weight: bold; width: 14px; }
    .status-active .symbol { color: var(--accent-color); }
    .status-done .symbol { color: var(--faint-color); }
    .status-error .symbol { color: var(--error-color); }
    .station { font-size: 10px; color: var(--label-color); width: 70px; flex-shrink: 0; }
    .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .time { font-size: 10px; color: var(--faint-color); text-align: right; width: 40px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    #toolbar { height: 32px; display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-bottom: 1px solid var(--line-color); font-size: 11px; }
    #toolbar button { background: var(--node-color); border: 1px solid var(--line-color); color: var(--text-color); padding: 2px 8px; border-radius: 3px; cursor: pointer; font-size: 10px; }
    #toolbar button:hover { background: var(--line-color); }
    #status { font-size: 10px; color: var(--error-color); margin-left: auto; }
    :root { --background-color: #0a0c11; --node-color: #12151c; --line-color: #272c36; --spoke-color: #1a1e27; --text-color: #ebe6dc; --label-color: #9ba1ab; --faint-color: #6b7280; --accent-color: #e1ac6e; --active-color: #f0c595; --error-color: #e8654f; }
    body.light { --background-color: #f5f2ea; --node-color: #ffffff; --line-color: #cfc9bc; --spoke-color: #e3ded2; --text-color: #1f2228; --label-color: #5f6570; --faint-color: #8b909a; --accent-color: #b8762a; --active-color: #8f560f; --error-color: #c5402b; }
  </style>
</head>
<body class="dark">
  <div id="app">
    <div id="toolbar">
      <button id="theme-btn">Тёмная</button>
      <button id="lang-btn">RU</button>
      <button id="motion-btn">Полная</button>
      <div id="status">—</div>
    </div>
    <div id="map"></div>
    <div id="feed"></div>
  </div>
  <script type="module">
    import { init } from './renderer/app.js'
    init()
  </script>
</body>
</html>
